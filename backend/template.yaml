AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Sistema RAG Serverless - DynamoDB (vector store) + Bedrock (Titan Embeddings v2 +
  Amazon Nova Micro) + Lambda (Python 3.12) + API Gateway HTTP API.

Parameters:
  TableName:
    Type: String
    Default: blog-table
    Description: Nome da tabela DynamoDB que armazena os posts e seus embeddings.
  EmbeddingModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0
  ChatModelId:
    Type: String
    Default: us.amazon.nova-micro-v1:0
  EmbeddingDimensions:
    Type: Number
    Default: 1024
  TopK:
    Type: Number
    Default: 3
  VectorIndexName:
    Type: String
    Default: embedding-index
    Description: Nome do índice vetorial (SearchVectors) da tabela DynamoDB.

Globals:
  Function:
    Timeout: 60
    MemorySize: 512
    Runtime: python3.12
    Architectures:
      - x86_64

Resources:
  # --------------------------------------------------------------------------
  # Tabela DynamoDB (vector store)
  # --------------------------------------------------------------------------
  BlogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      # Índice vetorial nativo (exige BillingMode PAY_PER_REQUEST).
      VectorIndexes:
        - IndexName: !Ref VectorIndexName
          VectorAttribute:
            AttributeName: embedding
          Dimensions: !Ref EmbeddingDimensions
          DistanceFunction: COSINE
          Projection:
            ProjectionType: ALL

  # --------------------------------------------------------------------------
  # HTTP API (API Gateway v2) com CORS liberado
  # --------------------------------------------------------------------------
  RagHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - "Content-Type"
        AllowMethods:
          - "POST"
          - "OPTIONS"

  # --------------------------------------------------------------------------
  # Função Lambda do RAG
  # --------------------------------------------------------------------------
  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: rag-chat-handler
      CodeUri: src/
      Handler: chat_handler.lambda_handler
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          EMBEDDING_MODEL_ID: !Ref EmbeddingModelId
          CHAT_MODEL_ID: !Ref ChatModelId
          EMBEDDING_DIMENSIONS: !Ref EmbeddingDimensions
          TOP_K: !Ref TopK
          VECTOR_INDEX_NAME: !Ref VectorIndexName
      Policies:
        # SearchVectors é autorizado no ARN do índice vetorial.
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:SearchVectors
              Resource:
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}/index/${VectorIndexName}"
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}"
                # Perfil de inferência (prefixo us.) e os modelos de fundação que ele roteia.
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${ChatModelId}"
                - "arn:aws:bedrock:*::foundation-model/amazon.nova-micro-v1:0"
      Events:
        Chat:
          Type: HttpApi
          Properties:
            ApiId: !Ref RagHttpApi
            Path: /chat
            Method: POST
        ChatOptions:
          Type: HttpApi
          Properties:
            ApiId: !Ref RagHttpApi
            Path: /chat
            Method: OPTIONS

  # --------------------------------------------------------------------------
  # Frontend: bucket S3 privado + distribuição CloudFront (OAC)
  # --------------------------------------------------------------------------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-frontend-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} - frontend React"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: frontend-s3
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: frontend-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          # Managed-CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        # Fallback de SPA: o acesso privado ao S3 retorna 403 para chaves inexistentes.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  # Permite somente a distribuição CloudFront ler o bucket.
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

Outputs:
  FrontendBucketName:
    Description: "Bucket S3 do frontend (aws s3 sync frontend/dist)"
    Value: !Ref FrontendBucket
  FrontendDistributionId:
    Description: "ID da distribuição CloudFront (para invalidação de cache)"
    Value: !Ref FrontendDistribution
  FrontendUrl:
    Description: "URL pública do frontend"
    Value: !Sub "https://${FrontendDistribution.DomainName}"
  ApiEndpoint:
    Description: "Endpoint para o frontend (POST /chat)"
    Value: !Sub "https://${RagHttpApi}.execute-api.${AWS::Region}.amazonaws.com/chat"
  TableName:
    Description: "Nome da tabela DynamoDB"
    Value: !Ref TableName
  FunctionName:
    Description: "Nome da função Lambda"
    Value: !Ref ChatFunction
